<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - dbdMinions</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/static/communitypage.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .page-title {
            font-size: 32px;
            font-weight: bold;
            margin: 0 0 15px 0;
        }
        .container {
            width: 100%;
            max-width: 650px;
            padding: 0 20px;
        }
        .top-bar {
            margin-bottom: 12px;
            text-align: left;
        }
        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: rgba(20, 20, 20, 0.9);
            border: 1px solid #555555;
            padding: 12px;
            margin-bottom: 20px;
            width: 100%;
        }
        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nick-input {
            width: 150px;
            background-color: #333;
            color: white;
            border: 1px solid #666;
            padding: 6px 8px;
            font-size: 14px;
            border-radius: 0;
        }
        .msg-input {
            width: 100%;
            height: 65px;
            background-color: #333;
            color: white;
            border: 1px solid #666;
            padding: 8px;
            font-size: 14px;
            border-radius: 0;
            resize: none;
        }
        .btn {
            background-color: #333333;
            color: white;
            border: 1px solid #777777;
            padding: 6px 14px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border-radius: 0;
        }
        .btn:hover {
            background-color: #444444;
        }
        .feed {
            background-color: rgba(20, 20, 20, 0.9);
            border: 1px solid #555555;
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            max-height: 450px;
            overflow-y: auto;
            width: 100%;
        }
        .post-item {
            padding: 10px 12px;
            border-bottom: 1px solid #444;
            font-size: 14px;
        }
        .post-item:last-child {
            border-bottom: none;
        }
        .post-author {
            font-weight: bold;
            color: #ffcc00;
            margin-right: 8px;
        }
        .post-content {
            color: #eee;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .no-posts {
            padding: 20px;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="page-title">Community</div>

    <div class="container">
        <div class="top-bar">
            <a href="/" class="btn">← Back</a>
        </div>

        <form action="/community/post" method="POST" class="chat-form">
            <div class="form-row">
                <input type="text" name="author" class="nick-input" placeholder="Nick" required autocomplete="off">
            </div>
            <div class="form-row">
                <textarea name="content" class="msg-input" placeholder="Write something..." required autocomplete="off"></textarea>
            </div>
            <div class="form-row" style="justify-content: flex-end;">
                <button type="submit" class="btn">Send</button>
            </div>
        </form>

        <ul class="feed">
            {% if posts %}
                {% for post in posts %}
                <li class="post-item">
                    <span class="post-author">{{ post[0] }}:</span>
                    <span class="post-content">{{ post[1] }}</span>
                </li>
                {% endfor %}
            {% else %}
                <li class="no-posts">No messages yet.</li>
            {% endif %}
        </ul>
    </div>

</body>
</html>
